
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TheGenZStore | Streetwear</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
 background:#080808;color:white;
 font-family:Arial,sans-serif;
}
header{
 display:flex;justify-content:space-between;
 align-items:center;padding:22px 6%;
 border-bottom:1px solid #292929;
}
.logo{font-size:23px;font-weight:900}
.logo span{color:#ff2638}
nav a{
 color:white;text-decoration:none;
 margin-left:18px;font-size:13px;
}
.hero{
 min-height:440px;padding:85px 7%;
 background:radial-gradient(ellipse at 75% 40%,#65121d,#080808 65%);
}
.hero small{color:#ff3445;letter-spacing:4px}
.hero h1{
 font-size:clamp(45px,9vw,90px);
 font-weight:900;line-height:.95;
 margin:25px 0;
}
.hero h1 span{color:#ff2638}
.hero p{color:#bbb;margin-bottom:28px}
.btn{
 display:inline-block;background:#ff2638;
 color:white;padding:15px 25px;
 text-decoration:none;font-weight:bold;
}
h2{text-align:center;margin:55px 0 30px;font-size:30px}
.products{
 display:grid;grid-template-columns:repeat(3,1fr);
 gap:18px;padding:0 6% 60px;
}
.card{
 background:#151515;border:1px solid #292929;
 padding:12px;transition:.4s;
}
.card:hover{transform:perspective(800px) rotateY(-5deg) translateY(-7px)}
.card img{
 width:100%;height:230px;object-fit:cover;
 background:#222;
}
.card h3{margin:15px 0 8px}
.price{color:#ff3445;font-weight:bold}
footer{
 text-align:center;padding:30px;
 border-top:1px solid #292929;color:#888;
}
@media(max-width:600px){
 nav a{margin-left:8px;font-size:11px}
 .products{grid-template-columns:repeat(2,1fr);gap:10px}
 .card img{height:170px}
 .hero{padding-top:75px}
}
</style>
</head>
<body>

<header>
 <div class="logo">THE<span>GENZ</span>STORE</div>
 <nav>
  <a href="#home">HOME</a>
  <a href="#shop">SHOP</a>
  <a href="#contact">CONTACT</a>
 </nav>
</header>

<section class="hero" id="home">
 <small>NEW STREETWEAR COLLECTION</small>
 <h1>RULE YOUR<br><span>STYLE.</span></h1>
 <p>Not made to fit in. Made to stand out.</p>
 <a class="btn" href="#shop">SHOP NOW →</a>
</section>

<h2 id="shop">🔥 OUR COLLECTION</h2>

<section class="products">
 <div class="card">
  <img src="https://images.unsplash.com/photo-1556821840-3a63f95609a7?w=600" alt="Hoodie">
  <h3>Premium Hoodie</h3>
  <p class="price">₹999</p>
 </div>
 <div class="card">
  <img src="https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?w=600" alt="T-shirt">
  <h3>Oversized T-Shirt</h3>
  <p class="price">₹499</p>
 </div>
 <div class="card">
  <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=600" alt="Shoes">
  <h3>Street Sneakers</h3>
  <p class="price">₹1499</p>
 </div>
</section>

<footer id="contact">
 <h3>THEGENZSTORE</h3>
 <p>Wear Different. Be Different.</p>
 <p>© 2026 TheGenZStore</p>
</footer>

</body>
</html>
