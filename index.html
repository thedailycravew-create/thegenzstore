
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>THEGENZSTORE | 3D STREETWEAR</title>

<script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#080808;color:white;font-family:Arial,sans-serif}
header{padding:20px 6%;display:flex;justify-content:space-between;border-bottom:1px solid #292929}
.logo{font-size:22px;font-weight:900}
.logo span{color:#ff2638}
.hero{text-align:center;padding:40px 15px;background:radial-gradient(#451018,#080808 70%)}
.hero h1{font-size:48px;font-weight:900}
.hero h1 span{color:#ff2638}
.hero p{color:#aaa;margin-top:12px}
.viewer{padding:15px}
model-viewer{
 width:100%;height:430px;
 background:radial-gradient(#321017,#090909 75%);
 --poster-color:transparent;
}
h2{text-align:center;margin:25px;color:#ff2638}
.details{text-align:center;padding:20px}
.price{font-size:26px;font-weight:bold;margin:15px}
button{background:#ff2638;color:white;border:0;padding:15px 35px;font-weight:bold;font-size:16px;border-radius:4px}
.note{color:#888;font-size:12px;margin-top:15px}
footer{text-align:center;padding:35px;color:#888}
</style>
</head>

<body>
<header>
<div class="logo">THE<span>GENZ</span>STORE</div>
<div>🛒 CART</div>
</header>

<section class="hero">
<h1>RULE YOUR <span>STYLE.</span></h1>
<p>PREMIUM 3D STREETWEAR COLLECTION</p>
</section>

<h2>🔥 3D HOODIE EXPERIENCE</h2>

<div class="viewer">
<model-viewer
src="./hoodie.glb"
alt="TheGenZStore 3D Hoodie"
camera-controls
auto-rotate
rotation-per-second="25deg"
shadow-intensity="1"
exposure="1"
environment-image="neutral"
ar>
</model-viewer>
</div>

<div class="details">
<h2>PREMIUM HOODIE</h2>
<div class="price">₹999</div>
<button onclick="alert('Shopping system coming soon!')">
ADD TO CART
</button>
<p class="note">Drag to rotate · Pinch to zoom</p>
</div>

<footer>
THEGENZSTORE<br>
WEAR DIFFERENT. BE DIFFERENT.
</footer>
</body>
</html>
